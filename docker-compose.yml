services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pakash
      POSTGRES_USER: pakash
      POSTGRES_PASSWORD: pakash
    volumes:
      - pakash-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pakash"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PAKASH_DATABASE_URL: ${PAKASH_DATABASE_URL:-postgresql://pakash:pakash@db:5432/pakash}
      PAKASH_DATABASE_SCHEMA: ${PAKASH_DATABASE_SCHEMA:-pakash}
      PAKASH_DATABASE_HOST: db
      PAKASH_RUNTIME_SETTINGS_FILE: /data/runtime-settings.json
      # Signs the workspace session cookie. Unset, the backend generates one
      # per process — fine for a single-container dev run, but sessions then
      # die on every restart. Set it in .env for anything long-lived.
      PAKASH_SESSION_SECRET: ${PAKASH_SESSION_SECRET:-}
      # The model runs on the host, not in the compose network.
      PAKASH_LLM_BASE_URL: ${PAKASH_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      PAKASH_LLM_MODEL: ${PAKASH_LLM_MODEL:-gemma3:27b}
      # Wall time for ONE HTTP completion. 0 = no limit: generation is a
      # background job the browser polls, so giving up is the UI's decision,
      # not a number guessed here. Set a positive value only to bound a
      # server that HANGS.
      PAKASH_LLM_TIMEOUT_SECONDS: ${PAKASH_LLM_TIMEOUT_SECONDS:-0}
      # Interactive calls fall back before a proxy turns queueing into a 500.
      # Schedule generation is background work and is not bounded by this.
      PAKASH_LLM_QUEUE_SECONDS: ${PAKASH_LLM_QUEUE_SECONDS:-180}
      # Env-only by design: the semaphore is built once at import, so this
      # cannot be changed from the settings panel. 1 suits Ollama; raise it
      # for a batching server (vLLM, TGI).
      PAKASH_LLM_MAX_CONCURRENCY: ${PAKASH_LLM_MAX_CONCURRENCY:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pakash-settings:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  copilot:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      PAKASH_DATABASE_URL: ${PAKASH_DATABASE_URL:-postgresql://pakash:pakash@db:5432/pakash}
      PAKASH_DATABASE_SCHEMA: ${PAKASH_DATABASE_SCHEMA:-pakash}
      PAKASH_DATABASE_HOST: db
      PAKASH_RUNTIME_SETTINGS_FILE: /data/runtime-settings.json
      PAKASH_LLM_BASE_URL: ${PAKASH_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      PAKASH_LLM_MODEL: ${PAKASH_LLM_MODEL:-gemma3:27b}
      # Same values as `backend`: the worker shares the settings volume and
      # calls the same model server, so a timeout that differs between them
      # would make the same work succeed or fail depending on which process
      # picked it up.
      PAKASH_LLM_TIMEOUT_SECONDS: ${PAKASH_LLM_TIMEOUT_SECONDS:-0}
      PAKASH_LLM_QUEUE_SECONDS: ${PAKASH_LLM_QUEUE_SECONDS:-180}
      PAKASH_LLM_MAX_CONCURRENCY: ${PAKASH_LLM_MAX_CONCURRENCY:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PAKASH_COPILOT_SCAN_SECONDS: ${PAKASH_COPILOT_SCAN_SECONDS:-1800}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pakash-settings:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Next bakes rewrites() into the build output, so the proxy target has
      # to be known at build time, not just in the running container.
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pakash-db:
  pakash-settings:
