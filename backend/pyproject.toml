[project]
name = "pakash-backend"
version = "0.1.0"
description = "Conversational shift-scheduling agent"
requires-python = "==3.8.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.23,<0.34",
    "pydantic>=2.5,<2.11",
    "pydantic-settings>=2.2,<2.8",
    "httpx>=0.27",
    "structlog>=24.1,<25",
    "psycopg[binary]>=3.1,<3.2",
    "psycopg-pool>=3.1,<3.3",
    "openai>=1.40,<2",
    "typing-extensions>=4.8",
    "backports.zoneinfo>=0.2.1; python_version < '3.9'",
    "numpy>=1.24,<1.25",
    "pandas>=2.0,<2.1",
    "openpyxl>=3.1,<3.2",
    # Multipart form parsing, required by FastAPI's `UploadFile`. The import
    # route (D7) takes the manager's own spreadsheets as file uploads, and
    # without this FastAPI raises at route-registration time rather than on
    # first request -- the whole app fails to start.
    "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<8.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Prompts are markdown beside the code that sends them. `packages.find` ships
# only .py, so without this they are missing from a built wheel and every LLM
# call raises "prompt not found".
[tool.setuptools.package-data]
"app.bl.prompts" = ["*.md", "shared/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
